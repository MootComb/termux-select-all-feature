name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Attach APK to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Determine which app to build. For manual dispatch we default to termux-app.
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.tag_name }}"
            RELEASE_NAME="${{ github.event.release.name }}"
          else
            REF=""
            RELEASE_NAME=""
          fi

          # ---- Auto-detect app + version ----
          if [ -n "$REF" ]; then
            SHORT_TAG_NAME="${REF#refs/tags/}"
            RELEASED_APP=${SHORT_TAG_NAME%-*}
            RELEASED_VERSION=${SHORT_TAG_NAME##*-}
          else
            # Manual run: pick app from repo layout (default termux-app)
            RELEASED_APP="termux-app"
            # Read version from Gradle
            RELEASED_VERSION=$(./gradlew -q :"$RELEASED_APP":versionName | tail -n1 | tr -d '[:space:]')
            SHORT_TAG_NAME="${RELEASED_APP}-${RELEASED_VERSION}"
            REF="$SHORT_TAG_NAME"
          fi

          echo "REF=$REF"
          echo "SHORT_TAG_NAME=$SHORT_TAG_NAME"
          echo "RELEASED_APP=$RELEASED_APP"
          echo "RELEASED_VERSION=$RELEASED_VERSION"

          # ---- Resolve human-readable app name ----
          case "$RELEASED_APP" in
            termux-app)    RELEASED_APP_NAME="Termux" ;;
            termux-api)    RELEASED_APP_NAME="Termux:API" ;;
            termux-style)  RELEASED_APP_NAME="Termux:Style" ;;
            termux-widget) RELEASED_APP_NAME="Termux:Widget" ;;
            *)
              echo "Unhandled RELEASED_APP=$RELEASED_APP"
              exit 1
              ;;
          esac

          # ---- Auto-generate release name if not provided ----
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$RELEASED_APP_NAME $RELEASED_VERSION"
          fi

          EXPECTED_RELEASE_NAME="$RELEASED_APP_NAME $RELEASED_VERSION"
          if [ "$RELEASE_NAME" != "$EXPECTED_RELEASE_NAME" ]; then
            echo "Invalid release name - expected '$EXPECTED_RELEASE_NAME', was '$RELEASE_NAME'"
            exit 1
          fi

          # ---- Version format check for termux-app ----
          if [ "$RELEASED_APP" = "termux-app" ]; then
            if ! [[ "$RELEASED_VERSION" =~ ^googleplay\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              echo "Bad version: $RELEASED_VERSION"
              exit 1
            fi
          fi

          # ---- Verify version from source matches ----
          ./gradlew -q :"$RELEASED_APP":versionName   # warm-up
          VERSION_FROM_SRC=$(./gradlew -q :"$RELEASED_APP":versionName | tail -n1 | tr -d '[:space:]')
          if [ "$VERSION_FROM_SRC" != "$RELEASED_VERSION" ]; then
            echo "Version mismatch: RELEASED_VERSION=$RELEASED_VERSION, VERSION_FROM_SRC=$VERSION_FROM_SRC"
            exit 1
          fi

          # ---- Build ----
          ./gradlew :"$RELEASED_APP":assembleDebug

          BUILT_APK=./"$RELEASED_APP"/build/outputs/apk/debug/"$RELEASED_APP"-debug.apk
          UPLOAD_APK="$RELEASED_APP"-debug-$RELEASED_VERSION.apk

          mv "$BUILT_APK" "$UPLOAD_APK"

          # ---- Create release if it doesn't exist (manual dispatch path) ----
          if ! gh release view "$REF" >/dev/null 2>&1; then
            echo "Creating release '$REF' with name '$RELEASE_NAME'"
            gh release create "$REF" \
              --title "$RELEASE_NAME" \
              --notes "Automated release for $RELEASED_APP_NAME $RELEASED_VERSION" \
              --target "${{ github.sha }}"
          fi

          # ---- Upload APK ----
          gh release upload "$REF" "${UPLOAD_APK}" --clobber
